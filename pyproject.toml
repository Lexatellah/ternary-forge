[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ternary-forge"
version = "0.2.0"
description = "Native balanced-ternary arithmetic and ternary-weight neural networks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ternary Forge" }]
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ternary_forge*"]